version: '3.8'

services:
    open-archiver:
        # `image` + `build` both set to the same tag: `docker compose up -d`
        # (or `pull`) uses the published CI image, while `docker compose up -d
        # --build` builds the local source tree and tags it over the same name.
        # Lets you switch between pulling and building local changes freely.
        image: logiclabshq/open-archiver:latest
        build:
            context: .
            dockerfile: apps/open-archiver/Dockerfile
        container_name: open-archiver
        restart: unless-stopped
        ports:
            - '3000:${PORT_FRONTEND:-3000}' # Frontend
        env_file:
            - .env
        volumes:
            - 'archiver-data:${STORAGE_LOCAL_ROOT_PATH}'
        depends_on:
            - postgres
            - valkey
            - meilisearch
        networks:
            - open-archiver-net

    postgres:
        image: postgres:17-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-open_archive}
            POSTGRES_USER: ${POSTGRES_USER:-admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - open-archiver-net

    valkey:
        image: valkey/valkey:8-alpine
        container_name: valkey
        restart: unless-stopped
        command: valkey-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - valkeydata:/data
        networks:
            - open-archiver-net

    meilisearch:
        image: getmeili/meilisearch:v1.38
        container_name: meilisearch
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-aSampleMasterKey}
            MEILI_SCHEDULE_SNAPSHOT: ${MEILI_SCHEDULE_SNAPSHOT:-86400}
        volumes:
            - meilidata:/meili_data
        networks:
            - open-archiver-net

    tika:
        image: apache/tika:3.2.2.0-full
        container_name: tika
        restart: always
        networks:
            - open-archiver-net

volumes:
    pgdata:
        driver: local
    valkeydata:
        driver: local
    meilidata:
        driver: local
    archiver-data:
        driver: local

networks:
    open-archiver-net:
        driver: bridge
